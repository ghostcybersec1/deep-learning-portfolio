[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kmd-weather-ai"
version = "0.1.0"
description = "Probabilistic spatiotemporal deep learning for WRF weather forecasts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "h5netcdf>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "torch>=2.3",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2,<5",
    "ipywidgets>=8.1",
]
dev = [
    "pytest>=8.2,<10",
]

[tool.setuptools.packages.find]
include = ["kmd_forecast*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
