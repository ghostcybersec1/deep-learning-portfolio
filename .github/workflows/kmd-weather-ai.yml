name: KMD Weather AI checks

on:
  workflow_dispatch:
  push:
    paths:
      - "projects/kmd-weather-ai/**"
      - ".github/workflows/kmd-weather-ai.yml"
  pull_request:
    paths:
      - "projects/kmd-weather-ai/**"
      - ".github/workflows/kmd-weather-ai.yml"

permissions:
  contents: read

concurrency:
  group: kmd-weather-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/kmd-weather-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/kmd-weather-ai/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest
